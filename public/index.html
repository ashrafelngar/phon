<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<title>فاحص الموبيل المستعمل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#14263B;--mut:#5E6C7C;--line:#DDE3EA;--pri:#14263B;--acc:#F2A900;--ok:#16895A;--bad:#C63D3D;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0D1722;--card:#15263A;--ink:#EAF0F6;--mut:#9BAABB;--line:#27394F;--pri:#F2A900;--on:#14263B;--ok:#3DC58C;--bad:#F07878}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:20px}h3{margin:14px 0 6px;font-size:16px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--pri);color:var(--on)}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.full{width:100%}button.sm{padding:6px 10px;font-size:13px}button.bad{background:var(--bad);color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}.tabs .on{background:var(--pri);color:var(--on)}.tabs button:not(.on){background:transparent;color:var(--ink);border:1px solid var(--line)}
.banner{background:var(--acc);color:#14263B;border-radius:12px;padding:10px 14px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.banner.exp{background:var(--bad);color:#fff}
.big{display:block;width:100%;text-align:right;padding:20px;margin-bottom:10px;border-radius:14px;font-size:18px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.big small{display:block;font-weight:400;color:var(--mut);font-size:14px}
.big.main{background:var(--pri);color:var(--on);border:0}.big.main small{color:inherit;opacity:.8}
.steps{display:flex;gap:4px;margin-bottom:12px}.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps .d{background:var(--acc)}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opts button{padding:8px 12px;font-size:14px;background:transparent;color:var(--ink);border:1px solid var(--line)}.opts button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.q{padding:10px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}.q b{font-size:14px}
.ph{border:1px dashed var(--line);border-radius:12px;padding:10px;text-align:center;font-size:14px}.ph img{max-width:100%;max-height:140px;border-radius:8px;display:block;margin:6px auto 0}
.price{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}.price div{background:var(--bg);border-radius:12px;padding:12px 4px}.price b{display:block;font-size:20px;color:var(--ok)}.price span{font-size:13px;color:var(--mut)}
.warn{background:#FCE9E9;color:#8A1F1F;border-radius:10px;padding:10px;margin:8px 0;font-weight:600}
.mut{color:var(--mut);font-size:13px}.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl-s{overflow-x:auto}
#toast{position:fixed;inset-inline:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:none;z-index:9;text-align:center}
.pre{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px;font-size:13px}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:17px;font-weight:800;line-height:1.2}.lg{width:42px;height:42px;border-radius:12px;object-fit:cover;background:var(--card)}
#pill{text-align:center}.pl{display:inline-block;font-size:12px;font-weight:600;background:var(--acc);color:#14263B;padding:2px 14px;border-radius:0 0 12px 12px}.pl.x{background:var(--bad);color:#fff}
main{padding-bottom:76px}.greet{font-weight:800;font-size:20px;margin:4px 2px 12px}.greet small{display:block;font-weight:400;color:var(--mut);font-size:14px}
.hero{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:20px 18px;border:0;border-radius:28px;color:#fff;background:linear-gradient(135deg,#14263B,#1F4E79 70%,#2A7F62);box-shadow:0 10px 24px rgba(20,38,59,.28);position:relative;overflow:hidden;margin-bottom:12px}
.hero:before{content:"";position:absolute;inset-inline-start:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .ic{flex:none;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}.hero .ic svg{width:38px;height:38px}
.hero .tx{flex:1}.hero b{display:block;font-size:19px}.hero small{display:block;font-weight:400;opacity:.85;font-size:13px}
.hero .go{flex:none;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#14263B;display:grid;place-items:center;font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 8px;border-radius:24px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tile .ic2{width:48px;height:48px;border-radius:50%;background:var(--bg);display:grid;place-items:center}.tile .ic2 svg{width:26px;height:26px}.tile b{font-size:15px}.tile em{font-style:normal;font-size:12px;color:var(--mut)}
.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;padding:0;border-radius:50%;background:#1FA855;color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:8}.fab svg{width:28px;height:28px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}.hd h2{margin:0}
.rc{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:center}.chip{font-size:12px;font-weight:600;color:var(--c);border:1px solid var(--c);border-radius:99px;padding:0 10px;white-space:nowrap}.r2{font-size:12px;color:var(--mut);margin-bottom:8px}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.r3 div{background:var(--bg);border-radius:10px;padding:6px 2px;font-weight:800;font-size:16px}.r3 span{display:block;font-weight:400;font-size:11px;color:var(--mut)}.r3 .mid{color:var(--ok)}
.spin{width:54px;height:54px;border:5px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}@keyframes sp{to{transform:rotate(360deg)}}.ld{text-align:center;padding:30px 16px}.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;width:3%;background:var(--acc);transition:width 1s}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.kv span{color:var(--mut)}.kv b{text-align:left;word-break:break-word}
.empty{text-align:center;padding:30px 10px;color:var(--mut);font-size:40px}.empty p{font-size:15px;margin:6px 0 12px}
</style></head><body><div class="wrap"><div id="pill"></div><header><div class="brand"><img class="lg" src="https://i.ibb.co/NnbZtfYF/1790930556682.jpg" alt=""><b>فاحص الموبيل المستعمل</b></div><div id="top"></div></header><main id="app"></main></div><div id="toast"></div><button id="fab" class="fab" onclick="help()" aria-label="مساعدة"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C7 3 3 6.6 3 11c0 2 .8 3.8 2.2 5.2L4 21l4.6-1.8c1 .3 2.2.5 3.4.5 5 0 9-3.6 9-8s-4-8-9-8z"/><circle cx="8.5" cy="11" r="1.2" fill="#1FA855"/><circle cx="12" cy="11" r="1.2" fill="#1FA855"/><circle cx="15.5" cy="11" r="1.2" fill="#1FA855"/></svg></button>
<script>

["الملحقات",[["acc","الموجود مع الجهاز",["كرتونة أصلية","شاحن أصلي","كابل","سماعة","جراب","فاتورة أو ضمان ساري"],0,0,1]]],
["الجمارك والضريبة",[["cus","الجهاز مسجّل والجمارك مدفوعة؟",["آه","لأ"],0]]]];

 if(!u&&view!=="auth")view="auth";

 if(u.ban){$a.innerHTML=`<div class="card"><h2>الحساب محظور</h2><p>تواصل مع الأدمن على ${ADMIN_PHONE}</p></div>`;return}

 $a.innerHTML=`<div class="card"><h2>أهلاً بيك يا تاجر</h2><p class="mut">اعرف سعر الشراء المناسب لأي جهاز أندرويد في دقيقتين.</p>

 <button class="full" onclick="${tab=="up"?"signup()":"login()"}">${tab=="up"?"إنشاء حساب":"دخول"}</button></div><div id="otp"></div>`}

 if(!d.name||!d.shop||!d.addr||!d.phone||d.pass.length<6)return toast("كمّل كل البيانات (كلمة السر 6 حروف على الأقل)");
